# Gradle 8.8 itself needs JDK 17+ to run (the JDK 8 toolchain below is only
# used to compile the mod). Pinned here so IDEs launch Gradle correctly too.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.1.12-hotspot

# Give the Gradle daemon room -- decompiling Minecraft is memory hungry.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# Gradle will download a JDK 8 toolchain automatically (see settings.gradle).
org.gradle.java.installations.auto-download=true
