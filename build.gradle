plugins {
    id 'java-library'
    id 'idea'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'com.darahz.dmod'
version = '1.0.0'

base {
    archivesName.set('dMod')
}

java {
    toolchain {
        // 1.7.10 must be compiled against Java 8. Gradle fetches this for you
        // via the foojay resolver configured in settings.gradle.
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion.set('1.7.10')

    // The dev-environment player name used by runClient.
    username.set('Darahz')

    // Enables assertions for your own code only.
    extraRunJvmArguments.add("-ea:${project.group}")
}

repositories {
    // Add mod maven repos here when you want other mods in your dev env.
}

dependencies {
    // Deobfuscated mods you only want at runtime (e.g. NEI for testing):
    // runtimeOnlyNonPublishable 'com.github.GTNewHorizons:NotEnoughItems:2.3.39-GTNH:dev'
}

processResources {
    // Keep mcmod.info's version in sync with this build script.
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
}
