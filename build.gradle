plugins {
    id 'java-library'
    id 'idea'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'com.darahz.dmod'
version = '1.0.0'

base {
    archivesName.set('dMod')
}

java {
    toolchain {
        // 1.7.10 must be compiled against Java 8. Gradle fetches this for you
        // via the foojay resolver configured in settings.gradle.
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion.set('1.7.10')

    // The dev-environment player name used by runClient.
    username.set('Darahz')

    // Enables assertions for your own code only.
    extraRunJvmArguments.add("-ea:${project.group}")
}

repositories {
    // Add mod maven repos here when you want other mods in your dev env.
}

dependencies {
    // Deobfuscated mods you only want at runtime (e.g. NEI for testing):
    // runtimeOnlyNonPublishable 'com.github.GTNewHorizons:NotEnoughItems:2.3.39-GTNH:dev'
}

processResources {
    // Keep mcmod.info's version in sync with this build script.
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
}

/**
 * LWJGL 2.9.4's natives bundle ships liblwjgl and jinput but no OpenAL, so
 * vanilla's MusicTicker dies with
 *   UnsatisfiedLinkError: org.lwjgl.openal.AL10.nalGetSourcei
 * about 45 seconds into any session. Link the system OpenAL in under the name
 * LWJGL looks for. No-op on non-Linux, or if the library isn't installed.
 */
def linkSystemOpenAl = tasks.register('linkSystemOpenAl') {
    description = 'Links system libopenal into the LWJGL natives dir so sound works on Linux.'
    doLast {
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            return
        }
        def nativesDir = file('run/natives/lwjgl2')
        if (!nativesDir.isDirectory()) {
            logger.lifecycle('linkSystemOpenAl: natives dir not extracted yet, skipping.')
            return
        }
        def system = ['/usr/lib/x86_64-linux-gnu/libopenal.so.1',
                      '/usr/lib64/libopenal.so.1',
                      '/usr/lib/libopenal.so.1'].collect { file(it) }.find { it.exists() }
        if (system == null) {
            logger.warn('linkSystemOpenAl: no system libopenal found - install libopenal1 for sound.')
            return
        }
        ['libopenal64.so', 'libopenal.so'].each { name ->
            def link = new File(nativesDir, name)
            if (!link.exists()) {
                ant.symlink(link: link.absolutePath, resource: system.absolutePath, overwrite: true)
                logger.lifecycle("linkSystemOpenAl: linked ${name} -> ${system}")
            }
        }
    }
}

tasks.matching { it.name in ['runClient', 'runObfClient'] }.configureEach {
    dependsOn linkSystemOpenAl
}
